<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="device" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a347f"/><stop offset="1" stop-color="#1688e8"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fdff"/><stop offset="1" stop-color="#cceeff"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<!-- Keep all foreground artwork inside the adaptive-icon safe area. -->
<ellipse cx="512" cy="820" rx="230" ry="28" fill="#00133f" opacity=".28" filter="url(#shadow)"/>
<!-- One centered calculator -->
<g>
  <rect x="300" y="190" width="424" height="590" rx="76" fill="url(#device)" stroke="#ffffff" stroke-width="22"/>
  <rect x="350" y="250" width="324" height="126" rx="24" fill="url(#screen)"/>
  <path d="M390 330h70" stroke="#1688e8" stroke-width="15" stroke-linecap="round"/>
  <path d="M490 330h125" stroke="#1688e8" stroke-width="15" stroke-linecap="round"/>
  <g fill="#eaf8ff">
    <rect x="350" y="420" width="76" height="76" rx="18"/>
    <rect x="462" y="420" width="76" height="76" rx="18"/>
    <rect x="574" y="420" width="76" height="76" rx="18"/>
    <rect x="350" y="530" width="76" height="76" rx="18"/>
    <rect x="462" y="530" width="76" height="76" rx="18"/>
    <rect x="574" y="530" width="76" height="76" rx="18"/>
    <rect x="350" y="640" width="76" height="76" rx="18"/>
    <rect x="462" y="640" width="188" height="76" rx="18"/>
  </g>
  <!-- Milk drop mark, integrated into the top of the single calculator -->
  <path d="M512 88 C512 88 566 148 566 184 C566 216 542 238 512 238 C482 238 458 216 458 184 C458 148 512 88 512 88Z" fill="#ffffff" stroke="#bdeaff" stroke-width="10"/>
</g>
</svg>