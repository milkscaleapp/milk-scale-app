name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create dummy www folder
      run: mkdir -p www

    - name: Add Android Platform
      run: npx cap add android

    - name: Sync Web assets
      run: npx cap sync

    # 1. सीधे फाइलों को मॉडिफाई करना (कोई sed कमांड नहीं, सीधे पूरी फाइल बदलना)
    - name: Force Android Settings
      run: |
        # variables.gradle को पूरा बदल दें
        echo "ext {
            minSdkVersion = 22
            compileSdkVersion = 34
            targetSdkVersion = 34
            androidxActivityVersion = '1.7.0'
            androidxAppCompatVersion = '1.6.1'
            androidxCoordinatorLayoutVersion = '1.2.0'
            androidxCoreVersion = '1.10.0'
            androidxFragmentVersion = '1.5.6'
            coreSplashScreenVersion = '1.0.0'
            androidxWebkitVersion = '1.6.1'
            junitVersion = '4.13.2'
            androidxJunitVersion = '1.1.5'
            androidxEspressoCoreVersion = '3.5.1'
            cordovaAndroidVersion = '10.1.1'
        }" > android/variables.gradle

        # AndroidManifest.xml में इंटरनेट परमिशन जोड़ें
        sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

    # 2. असली कीस्टोर बनाना (जिसे Google पहचान सके)
    - name: Generate Keystore
      run: |
        cd android/app
        keytool -genkeypair -v -keystore release.keystore -alias milkscale -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Milk Scale, OU=App, O=App, L=City, S=State, C=IN"

    # 3. build.gradle में साइनिंग सेटिंग्स डालना
    - name: Inject Signing Config
      run: |
        cd android/app
        sed -i '/android {/a \
            signingConfigs { \
                release { \
                    storeFile file("release.keystore") \
                    storePassword "123456" \
                    keyAlias "milkscale" \
                    keyPassword "123456" \
                } \
            }' build.gradle
        sed -i '/buildTypes {/a \
            release { \
                signingConfig signingConfigs.release \
            }' build.gradle

    # 4. पूरी तरह साफ-सफाई करके APK बनाना
    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Milk-Scale-APK-FINAL-V2
        path: android/app/build/outputs/apk/release/app-release.apk
