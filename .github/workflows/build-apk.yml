name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create dummy www folder
      run: mkdir -p www

    - name: Add Android Platform
      run: npx cap add android

    - name: Sync Web assets
      run: npx cap sync

    - name: Add Internet Permission
      run: |
        sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

    - name: Generate Temporary Keystore
      run: |
        cd android/app
        keytool -genkeypair -v -keystore release.keystore -alias milkkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Milk Scale, OU=App, O=App, L=City, S=State, C=IN"

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=app/release.keystore \
          -Pandroid.injected.signing.store.password=123456 \
          -Pandroid.injected.signing.key.alias=milkey \
          -Pandroid.injected.signing.key.password=123456

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Milk-Scale-Release-APK
        path: android/app/build/outputs/apk/release/app-release.apk
