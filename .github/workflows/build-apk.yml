name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create dummy www folder
      run: mkdir -p www

    - name: Add Android Platform
      run: npx cap add android

    - name: Sync Web assets
      run: npx cap sync

    # 1. इंटरनेट परमिशन और SDK सेटिंग्स को पक्का करना
    - name: Force Android Settings
      run: |
        # मैनिफेस्ट में इंटरनेट परमिशन जोड़ें
        sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        
        # सभी SDK वर्जन को 34 (Android 14) पर सेट करें
        echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
        sed -i 's/targetSdkVersion 33/targetSdkVersion 34/g' android/variables.gradle
        sed -i 's/targetSdkVersion 32/targetSdkVersion 34/g' android/variables.gradle
        sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' android/variables.gradle
        sed -i 's/compileSdkVersion 32/compileSdkVersion 34/g' android/variables.gradle
        
        # वर्जन कोड बढ़ाएं ताकि फोन इसे नया ऐप समझे
        sed -i 's/versionCode 1/versionCode 5/g' android/app/build.gradle
        sed -i 's/versionName "1.0"/versionName "1.0.5"/g' android/app/build.gradle

    - name: Generate Temporary Keystore
      run: |
        cd android/app
        keytool -genkeypair -v -keystore release.keystore -alias milkkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -dname "CN=Milk Scale, OU=App, O=App, L=City, S=State, C=IN"

    - name: Inject Signing Config
      run: |
        cd android/app
        sed -i '/android {/a \
            signingConfigs { \
                release { \
                    storeFile file("release.keystore") \
                    storePassword "123456" \
                    keyAlias "milkkey" \
                    keyPassword "123456" \
                } \
            }' build.gradle
        sed -i '/buildTypes {/a \
            release { \
                signingConfig signingConfigs.release \
            }' build.gradle

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Milk-Scale-Release-APK
        path: android/app/build/outputs/apk/release/app-release.apk
