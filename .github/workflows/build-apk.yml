name: Build Milk Scale signed releases

on:
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - "firestore.rules"
      - "package.json"
      - "build.js"
      - "capacitor.config.json"
      - "google-services.json"
      - ".github/workflows/build-apk.yml"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - "firestore.rules"
      - "package.json"
      - "build.js"
      - ".github/workflows/validate-web.yml"
      - "capacitor.config.json"
      - "google-services.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run build

      - name: Add and sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Milk Scale launcher icons
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 scripts/generate-android-icons.py

      - name: Set light Milk Scale launch screen background
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in (
              Path("android/app/src/main/res/values/styles.xml"),
              Path("android/app/src/main/res/values-v31/styles.xml"),
          ):
              if not path.exists():
                  continue
              source = path.read_text()
              def update_style(match):
                  name, attrs, body = match.group(1), match.group(2), match.group(3)
                  if "android:windowBackground" not in body:
                      body += '\n        <item name="android:windowBackground">#F8FBFF</item>'
                  if "Launch" in name and "windowSplashScreenBackground" not in body:
                      body += '\n        <item name="windowSplashScreenBackground">#F8FBFF</item>'
                  if "Launch" in name and "windowSplashScreenAnimatedIcon" not in body:
                      body += '\n        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>'
                  return '<style name="' + name + '"' + attrs + '>' + body + '</style>'
              source = re.sub(r'<style name="([^"]+)"([^>]*)>(.*?)</style>', update_style, source, flags=re.S)
              path.write_text(source)
          PY

      - name: Configure Firebase for Android
        run: |
          test -s google-services.json
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          root_text = root.read_text()
          dependency = "classpath 'com.google.gms:google-services:4.4.2'"
          if dependency not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Could not find root Gradle dependencies block")
              root_text = root_text.replace(marker, marker + "\n        " + dependency, 1)
              root.write_text(root_text)

          app = Path("android/app/build.gradle")
          app_text = app.read_text()
          plugin = "apply plugin: 'com.google.gms.google-services'"
          if plugin not in app_text:
              app.write_text(app_text.rstrip() + "\n\n" + plugin + "\n")
          PY

      - name: Set Android version code for upgrade installs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          version_code = int(os.environ["BUILD_NUMBER"])
          import re
          if re.search(r"versionCode\s+\d+", s):
              s = re.sub(r"versionCode\s+\d+", f"versionCode {version_code}", s, count=1)
          else:
              s = s.replace("defaultConfig {", f"defaultConfig {{\n        versionCode {version_code}", 1)
          p.write_text(s)
          print(f"Android versionCode set to {version_code}")
          PY

      - name: Configure persistent Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/milk-scale-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=milk-scale-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Keep any Gradle plugins block at the top of the file.
          android_marker = "android {"
          android_index = s.find(android_marker)
          if android_index < 0:
              raise SystemExit("Could not find android block in android/app/build.gradle")

          props = '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          '''
          if "def keystoreProperties =" not in s:
              s = s[:android_index] + props + s[android_index:]

          config = """    signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }

          """
          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {\n" + config, 1)

          build_types = s.find("buildTypes {")
          release_type = s.find("release {", build_types)
          if build_types < 0 or release_type < 0:
              raise SystemExit("Could not find release build type in android/app/build.gradle")
          if "signingConfig signingConfigs.release" not in s:
              insert_at = release_type + len("release {")
              s = s[:insert_at] + "\n            signingConfig signingConfigs.release" + s[insert_at:]
          p.write_text(s)
          PY

      - name: Build signed APK and Play Store AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
          cd ..
          cp android/app/build/outputs/apk/release/*.apk Milk-Scale.apk
          cp android/app/build/outputs/bundle/release/*.aab Milk-Scale.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Milk-Scale-production-release
          path: |
            Milk-Scale.apk
            Milk-Scale.aab
          if-no-files-found: error
