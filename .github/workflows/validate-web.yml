name: Validate Milk Scale offline web bundle

on:
  pull_request:
    branches: ["main", "ui-english-custom-dialogs"]
  push:
    branches: ["main", "ui-english-custom-dialogs", "offline-local-assets"]

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build local web assets
        run: npm run build
      - name: Check bundled assets
        run: |
          test -s www/index.html
          test -s www/vendor/fontawesome/css/all.min.css
          test -s www/vendor/capacitor-filesystem.js
          test -d www/vendor/fontawesome/webfonts
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("www/index.html").read_text()
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S | re.I)
          scripts = [script for script in scripts if script.strip()]
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          for index, script in enumerate(scripts):
              Path(f"/tmp/milk-scale-{index}.js").write_text(script)
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
          for file in /tmp/milk-scale-*.js; do node --check "$file"; done
      - name: Ensure no remote app dependencies
        run: |
          ! grep -E 'https?://(cdnjs.cloudflare.com|fonts.googleapis.com|fonts.gstatic.com|unpkg.com)' www/index.html
